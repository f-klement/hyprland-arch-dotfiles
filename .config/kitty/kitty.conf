## theme.conf is a symlink kept in sync with the desktop-wide Rose Pine /
## Tokyo Night toggle (see ~/.config/hypr/scripts/DarkLight.sh) -- was
## hardcoded to Catppuccin Mocha (mocha.conf), the one place left off that
## toggle, so the terminal never matched the rest of the desktop.
include ./theme.conf
font_family      jetbrains mono nerd font
font_size        10
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0
background_opacity 0.90
clipboard_control write-clipboard write-primary read-clipboard read-primary
allow_remote_control yes
listen_on unix:@mykitty

shell /usr/bin/zsh
