# Chromium-family "flags file" -- read on every launch, one flag per line.
# See https://wiki.archlinux.org/title/Chromium#Making_Chromium.2FGoogle_Chrome_use_the_Wayland_backend
#
# Added 2026-09-06: nothing here forced Brave onto native Wayland before.
# GDK_BACKEND in env.lua only affects real GTK apps -- Brave is Chromium/
# Aura-based and picks X11-vs-Wayland via its own Ozone backend, which
# defaults to X11 (XWayland) unless told otherwise. This machine is
# Hyprland/Wayland-only, so:
--ozone-platform-hint=auto

# Hyprland (like most wlroots compositors) doesn't draw server-side
# window decorations, so without this Brave's window can look/behave
# oddly (no title bar for the compositor to grab, etc.) under native
# Wayland. This tells Chromium to draw its own client-side ones instead.
--enable-features=WaylandWindowDecorations
