# hyprpaper config -- replaces awww (see UserScripts/WallpaperAutoChange.sh
# and friends, which now call `hyprctl hyprpaper ...` instead of `awww`)
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# NOT VERIFIABLE from this session -- see hypridle.conf's note.
#
# TRADE-OFF (flagged when you chose this): hyprpaper has no crossfade/wipe/
# grow transition support like awww did -- wallpaper changes are a hard cut.
# It's the lighter, more minimal option by design.

ipc = on
splash = false

preload = ~/Pictures/wallpapers/Fantasy-Landscape.png

wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/Fantasy-Landscape.png
    fit_mode = cover
}
