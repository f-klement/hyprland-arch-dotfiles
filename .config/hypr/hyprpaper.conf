# hyprpaper config -- replaces awww (see UserScripts/WallpaperAutoChange.sh
# and friends, which now call `hyprctl hyprpaper ...` instead of `awww`)
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# TRADE-OFF (flagged when you chose this): hyprpaper has no crossfade/wipe/
# grow transition support like awww did -- wallpaper changes are a hard cut.
# It's the lighter, more minimal option by design.
#
# BUG FOUND (2026-09-06): this preload/wallpaper block pointed at
# ~/Pictures/wallpapers/Fantasy-Landscape.png -- copied verbatim from the
# Hyprland wiki's example config and never swapped for a real file. That
# path never existed on this machine, so hyprpaper started every login with
# nothing loaded: no crash, no log, just a blank background until something
# else set one. Pointed at a real wallpaper below so there's never a gap
# between hyprpaper starting and autostart.lua's WallpaperAutoChange.sh (now
# wired through WallpaperRandom.sh, see that script) landing the real
# session-start pick a moment later.

ipc = on
splash = false

preload = ~/Pictures/wallpapers/night_city.png

wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/night_city.png
    fit_mode = cover
}
