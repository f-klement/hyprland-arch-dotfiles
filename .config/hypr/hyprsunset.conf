# hyprsunset config -- replaces wlsunset (scripts/NightlightToggle.sh)
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# NOT VERIFIABLE from this session -- see hypridle.conf's note.
#
# REAL FEATURE LOSS (flagged when you chose this): wlsunset computed
# sunrise/sunset from your actual lat/long (48.2N, 16.3E -- Vienna) every
# day, year-round. hyprsunset works off fixed time-of-day profiles instead,
# not a solar calculation, so there's no equivalent of `-l 48.2 -L 16.3`.
# The times below are a rough fixed approximation of Vienna's sunrise/
# sunset and WILL be wrong by well over an hour at the summer/winter
# extremes. If accurate solar timing matters to you, wlsunset is arguably
# the better tool for this one specifically -- happy to keep wlsunset just
# for this piece and only swap the rest, say the word.

max-gamma = 100

profile {
    time = 07:30
    identity = true
}

profile {
    time = 19:00
    temperature = 4500
}
