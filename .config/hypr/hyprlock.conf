# hyprlock config -- replaces swaylock-effects (scripts/LockScreen.sh)
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Based on the actual example shipped with the installed package
# (/usr/share/hypr/hyprlock.conf, hyprlock 0.9.6), adapted to Tokyo Night
# colors and a heavier blur (replicating swaylock-effects' whole reason for
# existing over plain swaylock) using the current wallpaper as background.
#
# hyprlock can't be safely test-run from here (it would actually try to
# lock this live session) -- test it yourself once, ideally with a second
# TTY/session open the first time, standard hyprlock caution.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/rofi/.current_wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(16161ecc) # Tokyo Night bg_dark

    outer_color = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg # Tokyo Night blue -> magenta
    check_color = rgba(9ece6aee) rgba(7dcfffee) 120deg # Tokyo Night green -> cyan
    fail_color = rgba(f7768eee) rgba(db4b4bee) 40deg # Tokyo Night red

    font_color = rgb(192, 202, 245) # Tokyo Night fg
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ee)
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(bb9af7ee)
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT[de,us]
    color = rgba(c0caf5ee)
    font_size = 24
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
