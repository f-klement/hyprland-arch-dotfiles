# hyprlock config -- replaces swaylock-effects (scripts/LockScreen.sh)
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# NOT VERIFIABLE from this session -- see hypridle.conf's note. Test with
# `hyprlock` directly (Ctrl+Alt+F2 back out if something's wrong and it
# won't unlock -- or keep a second TTY session open the first time you
# try it, standard hyprlock caution).
#
# Background follows whatever wallpaper is currently active (same file
# WallpaperAutoChange.sh keeps a symlink to for rofi); cursor and fonts
# match the rest of the Tokyo Night + Dracula-cursor setup.

general {
    disable_loading_bar = false
    grace = 0
    hide_cursor = false
    no_fade_in = false
}

background {
    path = ~/.config/rofi/.current_wallpaper
    blur_size = 4
    blur_passes = 2
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(7aa2f7ee)
    inner_color = rgba(16161eee)
    font_color = rgba(c0caf5ee)
    fade_on_empty = true
    placeholder_text = <span foreground="##c0caf5">Password...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(c0caf5ee)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(bb9af7ee)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(c0caf5ee)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}
