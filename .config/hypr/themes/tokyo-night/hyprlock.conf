# Tokyo Night colours for hyprlock (sourced from hyprlock.conf via the
# hyprlock-colors.conf symlink that scripts/DarkLight.sh points here)
$lock_inner = rgba(16161ecc)                       # bg_dark
$lock_outer = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg  # blue -> magenta
$lock_check = rgba(9ece6aee) rgba(7dcfffee) 120deg # green -> cyan
$lock_fail  = rgba(f7768eee) rgba(db4b4bee) 40deg  # red
$lock_font  = rgb(192, 202, 245)                   # fg
$lock_time  = rgba(c0caf5ee)                       # fg
$lock_date  = rgba(bb9af7ee)                       # magenta
