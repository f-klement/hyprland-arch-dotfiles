# hypridle config -- replaces the old swayidle exec-once line in autostart.lua
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Based on the actual example shipped with the installed package
# (/usr/share/hypr/hypridle.conf, hypridle 0.1.8) -- in particular the
# `hyprctl dispatch 'hl.dsp.dpms({action = "..."})'` form for DPMS, which is
# what this Hyprland version's own shipped example uses for that dispatcher.
#
# Staggered timeouts as requested: lock at 15min, screen off at 20min,
# suspend at 30min.

general {
    lock_cmd = pidof hyprlock || hyprlock          # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session        # lock before suspend.
    # Second command added (2026-09-11): nudges the qemu network watchdog to
    # check immediately on resume instead of waiting up to its normal 15s
    # poll interval -- suspend/resume is one of the disturbances that's
    # actually broken virbr0/a running VM's interface on this host before.
    # Backgrounded so it can't delay the screen coming back on.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' ; ~/.config/hypr/scripts/QemuNetworkWatchdog.sh --once &
}

listener {
    timeout = 900                                   # 15min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200                                  # 20min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800                                  # 30min: suspend
    on-timeout = systemctl suspend
}
