# hypridle config -- replaces the old swayidle exec-once line in autostart.lua
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# NOT VERIFIABLE from this session: hypridle isn't installed yet (needs
# `sudo pacman -S hypridle hyprlock hyprsunset hyprpaper hyprpolkitagent`),
# and unlike hyprland.lua there's no `--verify-config`-equivalent for it, so
# this is best-effort based on documented syntax, not tested. Run
# `hypridle` in a terminal after installing and watch for parse errors.
#
# Staggered timeouts as requested: lock at 15min, screen off at 20min,
# suspend at 30min.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
