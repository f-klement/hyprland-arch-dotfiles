<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" version="1.1">
 <!-- Custom earbud-in-a-circle glyph (request 2026-09-11) -- replaces the
      earlier ring+stem "internet-radio-symbolic" glyph, which read as a
      stop/prohibited sign at 15px in the bar. Full opacity = playing. -->
